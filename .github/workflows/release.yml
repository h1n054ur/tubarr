# Builds the public image for a release tag and publishes the GitHub release. Runs on GitHub Actions.
#
# On a tag vX.Y.Z (or vX.Y.Z-rc.N):
#   notes    checks the tag against the crate version and takes the release notes from CHANGELOG.md
#   build    builds the Dockerfile natively on an amd64 and an arm64 runner and pushes each image by
#            digest to ghcr.io/<owner>/tubarr, with SBOM and provenance attestations
#   merge    joins the two into one multi-arch image tagged X.Y.Z, X.Y and latest. A pre-release
#            (any tag with a "-") gets only X.Y.Z-rc.N, never X.Y or latest.
#   smoke    pulls the release on each architecture, checks the version and starts a server
#   release  creates the GitHub release with the notes, marked as a pre-release for a "-" tag
#
# Run it by hand from the Actions tab (workflow_dispatch) for a dry run: both architectures build and
# run --version, nothing is pushed and no release is made.
#
# Needs no secrets: GITHUB_TOKEN pushes to GHCR and creates the release. A new GHCR package starts
# private. Make it public once in the package settings after the first release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release half pushed is worse than a late one, so never cancel.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  e2e:
    name: Real E2E
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Docker availability
        run: docker info
      - name: Harness runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg python3
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build source binary
        run: cargo build --release --locked
      - name: Real Sonarr and Radarr end-to-end check
        run: e2e/run.sh "$RUNNER_TEMP/tubarr-e2e-sanitized"
      - name: Sanitized failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-failure-evidence
          path: ${{ runner.temp }}/tubarr-e2e-sanitized
          retention-days: 3
          if-no-files-found: warn

  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Version
        id: version
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tubarr/Cargo.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "${version%%-*}" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $crate in crates/tubarr/Cargo.toml"
              exit 1
            fi
          else
            version="$crate"
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version $version, pre-release $prerelease"
      - name: Release notes
        # A dry run of an unreleased version has no dated section yet, so it only shows what it finds.
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/release-notes.sh "$VERSION" > release-notes.md
          else
            if ! scripts/release-notes.sh "$VERSION-dry-run" > release-notes.md; then
              echo "::notice::no CHANGELOG section for $VERSION yet, which is fine for a dry run"
            fi
          fi
          cat release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [notes, checks, e2e]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image name
        # GHCR wants the name in lower case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tubarr" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Tubarr
            org.opencontainers.image.description=YouTube as a source for Sonarr and Radarr
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.notes.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: TUBARR_GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # A tag pushes the image by digest only, the merge job names it. A dry run loads it into
          # the runner's Docker for the check below. The Docker exporter takes no attestations.
          outputs: >-
            ${{ github.event_name == 'push'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || 'type=docker,name=tubarr:dry-run' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Dry run check
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          docker run --rm tubarr:dry-run --version
          test "$(docker image inspect --format '{{.Architecture}}' tubarr:dry-run)" = "$ARCH"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Keep the digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tubarr" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # latest=auto moves latest only on a final release. A pre-release gets only {{version}}.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.title=Tubarr
            org.opencontainers.image.description=YouTube as a source for Sonarr and Radarr
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$(ls | wc -l)" != 2 ]; then echo "::error::expected two digests, got: $(ls)"; exit 1; fi
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  smoke:
    needs: [notes, merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tubarr" >> "$GITHUB_ENV"
      # The package is private until someone makes it public, so pull signed in.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and check the version
        run: |
          set -euo pipefail
          ref="$IMAGE:$VERSION"
          docker pull --platform "linux/$ARCH" "$ref"
          test "$(docker image inspect --format '{{.Architecture}}' "$ref")" = "$ARCH"
          out=$(docker run --rm --platform "linux/$ARCH" "$ref" --version)
          echo "$out"
          test "$out" = "tubarr ${VERSION%%-*}"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.notes.outputs.version }}
      - name: Start a server
        # The smallest config there is. The healthcheck asks /healthz the way the image's own
        # HEALTHCHECK does.
        run: |
          set -euo pipefail
          mkdir -p config
          echo 'public_url = "http://127.0.0.1:8480"' > config/tubarr.toml
          chmod -R a+rwX config
          docker run -d --name tubarr --platform "linux/$ARCH" -v "$PWD/config:/config" "$IMAGE:$VERSION"
          for _ in $(seq 30); do
            if docker exec tubarr /usr/local/bin/tubarr --healthcheck; then
              echo "healthy"
              docker logs tubarr
              exit 0
            fi
            sleep 2
          done
          docker logs tubarr
          echo "::error::the server did not answer /healthz within a minute"
          exit 1
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.notes.outputs.version }}

  release:
    needs: [notes, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the release
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tubarr:$VERSION"
          printf '\nImage for linux/amd64 and linux/arm64:\n\n```sh\ndocker pull %s\n```\n' "$image" >> release-notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Tubarr $VERSION" --notes-file release-notes.md "${flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
